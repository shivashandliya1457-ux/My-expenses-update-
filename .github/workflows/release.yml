name: Build and Release APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Get Version
        run: echo "VN=$(jq -r .versionName version.json)" >> $GITHUB_ENV
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Create dummy keystore
        run: keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=IN"
      - name: Build APK
        run: gradle assembleRelease --no-configuration-cache -Dorg.gradle.configuration-cache=false -Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password=android
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: v${{ env.VN }}
          files: app/build/outputs/apk/release/app-release.apk
